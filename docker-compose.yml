services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run setup:local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:local}
      POSTGRES_DB: ${POSTGRES_DB:-episode}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - episode-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  episode-db:
