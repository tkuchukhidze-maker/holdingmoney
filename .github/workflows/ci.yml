name: Platform checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: episode
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: episode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U episode -d episode_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://episode:ci-only-password@127.0.0.1:5432/episode_test
      APP_ORIGIN: http://localhost:3000
      EPISODE_TEST_DATABASE: '1'
      REQUIRE_EMAIL_VERIFICATION: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Generate ephemeral test secret
        run: node -e "const secret=require('crypto').randomBytes(48).toString('hex'); console.log('::add-mask::'+secret); require('fs').appendFileSync(process.env.GITHUB_ENV, 'BETTER_AUTH_SECRET='+secret+'\n')"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
