name: Phase 1 checks
on:
  push:
    branches:
      - 'phase/**'
      - 'main'
  pull_request:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_LOCALE: ka
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, xml
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve PHP packages
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validate PHP configuration
        run: composer validate --no-check-publish
      - name: PHP style
        run: vendor/bin/pint --test
      - name: PHP tests (Pest)
        run: php artisan test
      - name: Install frontend
        run: npm install --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Vite build
        run: npm run build

  prototype-preview:
    name: Validate approved design previews
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prototype-preview
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated viewer dependencies
        run: npm install --no-audit --no-fund
      - name: Validate markup and interactions
        run: npm run check && npm run validate
      - name: Build nine approved previews
        run: npm run build
      - name: Verify compiled screen files
        run: |
          test -f dist/index.html
          test -f dist/project/Admin.dc.html
          test -f dist/project/Magnolia.dc.html
          test -f dist/project/Main.dc.html
          test -f dist/assets/main.js
      - name: Probe Cloud HTTP readiness and approved preview assets
        run: npm run test:routes && npm run test:venues && npm run test:booking && npm run test:menu && npm run test:profile && npm run test:mobile && npm run test:readiness
