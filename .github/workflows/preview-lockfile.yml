name: Generate Preview npm lockfile
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/preview-lockfile.yml
      - prototype-preview/package.json
permissions:
  contents: write
jobs:
  preview-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and lock exact dependencies
        working-directory: prototype-preview
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install
        working-directory: prototype-preview
        run: npm ci --no-audit --no-fund
      - name: Check all screens and scripts
        working-directory: prototype-preview
        run: |
          npm run check
          npm run validate
          npm run build
      - name: Commit generated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototype-preview/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(preview): commit reproducible npm lockfile"
          git push origin HEAD:main
